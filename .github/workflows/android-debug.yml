name: Android debug APK

on:
  push:
    branches: [ai-agent]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # a fixed debug key, so each build installs over the previous one
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
      - name: Build debug APK
        run: ./gradlew --no-daemon :android:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: spd-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
